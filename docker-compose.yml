services:
  gateway:
    build: .
    image: ai-gateway:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Ollama установлена нативно на Windows-хосте (Docker Desktop сам резолвит host.docker.internal)
      - AIGW_OLLAMA_URL=http://host.docker.internal:11434
      - AIGW_DATABASE_URL=postgresql+psycopg://aigw:${POSTGRES_PASSWORD:-aigw}@postgres:5432/aigw
      - AIGW_DATA_DIR=/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hf-cache:/home/app/.cache/huggingface
      - gateway-data:/data
      - ./models.yaml:/app/models.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  # История распознаваний и очередь задач. Порт наружу не публикуется.
  # Резервная копия: docker compose exec postgres pg_dump -U aigw aigw > backup.sql
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aigw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigw}
      POSTGRES_DB: aigw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aigw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  hf-cache:
  gateway-data:
  pgdata:
