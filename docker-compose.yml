services:
  gateway:
    build: .
    image: ai-gateway:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - AIGW_OLLAMA_URL=http://ollama:11434
      - AIGW_DATABASE_URL=postgresql+psycopg://aigw:${POSTGRES_PASSWORD:-aigw}@postgres:5432/aigw
      - AIGW_DATA_DIR=/data
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - hf-cache:/home/app/.cache/huggingface
      - gateway-data:/data
      - ./models.yaml:/app/models.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  # Порты наружу не публикуются: единственная точка входа — шлюз.
  # Отладка: docker compose exec ollama ollama ps|pull|list
  ollama:
    # при смене версии перезаписать фикстуры: uv run python scripts/record_ollama_fixtures.py
    # (нормализация tool_calls не реализована, т.к. 0.40.8 отдаёт их корректно)
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # История распознаваний и очередь задач. Порт наружу не публикуется, как у Ollama.
  # Резервная копия: docker compose exec postgres pg_dump -U aigw aigw > backup.sql
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aigw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigw}
      POSTGRES_DB: aigw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aigw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  hf-cache:
  ollama-models:
  gateway-data:
  pgdata:
