# PostgreSQL для разработки и тестов на Mac: docker compose -f compose.dev.yaml up -d
# Порт 55432 (не 5432): на машине разработки его могут занимать другие проекты.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aigw
      POSTGRES_PASSWORD: aigw
      POSTGRES_DB: aigw
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aigw-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aigw"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aigw-dev-pgdata:
