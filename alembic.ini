# Alembic для разработки: `uv run alembic upgrade head`; AIGW_DATABASE_URL переопределяет URL ниже.
# Шлюз применяет миграции сам при старте (ai_gateway.db.engine.migrate) — этот файл в рантайме не нужен.
[alembic]
script_location = src/ai_gateway/db/migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://aigw:aigw@localhost:55432/aigw
